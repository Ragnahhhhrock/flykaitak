name = "flykaitak-scores"
main = "worker.js"
compatibility_date = "2026-01-01"
# routes = [{ pattern = "replay.flykaitak.com", custom_domain = true }]   # optional, see the bottom of this file

[[d1_databases]]
binding = "DB"
database_name = "flykaitak-scores"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

# Replay share links (see docs/replays.md): videos are stored in this R2 bucket.
[[r2_buckets]]
binding = "REPLAYS"
bucket_name = "flykaitak-replays"

# ATC radio voices (see docs/radio-voices.md): generated lines are cached in this R2 bucket.
# Secret: npx wrangler secret put ELEVENLABS_API_KEY
[[r2_buckets]]
binding = "TTS"
bucket_name = "flykaitak-radio"

[vars]
ELEVENLABS_VOICE_APP = "onwK4e9ZLuTAKqWW03F9"   # Hong Kong Approach: Daniel, steady broadcaster
ELEVENLABS_VOICE_TWR = "pqHfZKP75CvOlQylNhV4"   # Kai Tak Tower: Bill, wise and mature
ELEVENLABS_VOICE_YOU = "iP95p4xoKVk53GoZ742B"   # your readbacks: Chris, down-to-earth
ELEVENLABS_VOICE_OTH = "IKne3meq5aSn9XLyUdCD"   # other crews: Charlie, deep and energetic

# Optional: serve the share pages from your own domain instead of workers.dev (DNS is on Cloudflare).
# Uncomment the PUBLIC_BASE line under [vars] above and the routes line near the top, then run npx wrangler deploy again.
# PUBLIC_BASE = "https://replay.flykaitak.com"
