name = "flykaitak-scores"
main = "worker.js"
compatibility_date = "2026-01-01"
# routes = [{ pattern = "replay.flykaitak.com", custom_domain = true }]   # optional, see the bottom of this file

[[d1_databases]]
binding = "DB"
database_name = "flykaitak-scores"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

# Replay share links (see docs/replays.md): videos are stored in this R2 bucket.
[[r2_buckets]]
binding = "REPLAYS"
bucket_name = "flykaitak-replays"

# Optional: serve the share pages from your own domain instead of workers.dev (DNS is on Cloudflare).
# Uncomment both [vars] lines here and the routes line near the top, then run npx wrangler deploy again.
# [vars]
# PUBLIC_BASE = "https://replay.flykaitak.com"
