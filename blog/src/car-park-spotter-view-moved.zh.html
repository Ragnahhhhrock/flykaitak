<p>「停車場天台」視角而家會帶你去客運大樓陸側嘅新停車場。你企喺矮段天台跑道嗰頭、近馬路嗰個角嘅欄河邊，觀機人群喺你後面同旁邊。</p>

<h2>望過客運大樓冇遮擋</h2>
<p>停車場而家高咗少少（矮段八層、高段九層），所以喺欄河邊可以望過客運大樓頂，睇到停機位、跑道同海港，仲可以望過九龍城睇 IGS 轉彎。觀機人群唔會再擋住鏡頭。</p>
