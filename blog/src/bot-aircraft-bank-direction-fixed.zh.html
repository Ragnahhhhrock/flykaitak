<p>模擬器入面其他飛機轉彎時嘅傾側方向反咗。右轉嘅客機會見到左翼向下，左轉亦一樣。而家進場同離場嘅飛機都會好似真正客機咁，向轉彎嗰邊傾側。</p>

<h2>改咗啲乜</h2>
<p>進場飛機喺九龍城上空做 47° 右轉，離場飛機喺海港上空做右轉，兩種都將傾側方向畫反咗。等候航線上面嘅飛機一直都正確，所以我哋只修正咗錯嘅兩種。</p>
