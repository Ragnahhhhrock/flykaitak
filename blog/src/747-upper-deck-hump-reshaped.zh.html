<p>747-400 嘅上層艙隆起部分之前太高又太窄，望落好似機頂企咗座塔。而家改成較低較闊，後面有一段長而平緩嘅斜坡接返落機頂，同真正 747 嘅形狀更加似。</p>

<div class="readouts" role="list">
  <div class="readout" role="listitem"><b>低咗大約三分一</b><span>隆起高度<i>相對機身頂部</i></span></div>
  <div class="readout" role="listitem"><b>更長</b><span>向後斜坡<i>接返機頂線條</i></span></div>
</div>

<h2>改咗啲乜</h2>
<p>隆起部分喺主機身頂部之上低咗大約三分一，按比例亦闊咗少少。佢喺機鼻後面開始升起，喺駕駛艙同上層艙前段保持最高，然後逐漸向後收返入機頂。駕駛艙玻璃同上層艙窗都跟住新形狀。</p>
