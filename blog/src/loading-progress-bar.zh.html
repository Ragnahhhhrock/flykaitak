<p>Fly Kai Tak 載入時，主畫面而家會顯示進度條同百分比，一眼就知載入到幾多、仲要等幾耐。</p>

<h2>你會見到咩</h2>
<ul>
  <li>「Building Hong Kong」字樣下面有條進度條同百分比。頭一段係地圖、地形同航拍相下載，之後係起緊城市、機場、港口同船隻。</li>
  <li>每完成一個階段，進度條就前進一格，唔會再停喺同一句字幾秒。</li>
  <li>如果地圖資料載入唔到，或者瀏覽器冇 WebGL，會顯示提示，進度條會隱藏。</li>
</ul>
