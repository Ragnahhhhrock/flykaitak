<p>「Turn your phone sideways」提示已經移除。以前直向會暫停飛行，有啲玩家轉咗電話提示都仲喺度。而家無論直向定橫向，都可以直接玩。</p>

<h2>改咗啲乜</h2>
<ul>
  <li>無咗旋轉提示，直向亦唔會自動暫停。</li>
  <li>橫向仍然係比較好嘅飛行方式。喺手機上，<strong>Begin descent</strong> 仍然會進入全螢幕，並喺瀏覽器容許嗰陣要求橫向。</li>
  <li>精簡工具列、More 抽屜同橫向版面同之前一樣。</li>
</ul>
