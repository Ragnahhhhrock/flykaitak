<p>主畫面載入時，角落地圖唔會再自動開啟。佢預設收埋，要睇先自己開。</p>

<h2>改咗啲乜</h2>
<p>地圖以前預設係開嘅，而家喺主畫面同飛行入面都預設關閉。㩒 <kbd>M</kbd> 鍵，或者喺「選項」剔選「即時飛機地圖」就會顯示。剔選格預設冇剔，會跟住 M 鍵變；你撳「Begin descent」嗰一刻係點，飛行就點開始。</p>
