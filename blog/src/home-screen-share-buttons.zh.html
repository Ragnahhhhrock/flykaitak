<p>主畫面而家有分享掣，唔使離開選單就可以將 Fly Kai Tak 介紹畀朋友。</p>

<h2>喺主畫面分享</h2>
<p>示範短片下面多咗一排 <strong>分享 Fly Kai Tak</strong>：X、Facebook、Reddit、WhatsApp、Threads、電郵同複製連結。每個掣都會帶一句遊戲簡介同 flykaitak.com 連結。手機同支援嘅瀏覽器仲有「分享…」掣，可以開系統分享選單。</p>
