<p>原本得一個鏡頭選單，而家分咗做三個：飛行視角、觀機位置同客運大樓內部。每個清單短咗，易睇咗。</p>

<h2>每個選單有啲咩</h2>
<ul>
<li><strong>飛行視角：</strong>Cockpit、Exterior、Tower 同 Cabin seat</li>
<li><strong>觀機位置：</strong>九龍城街道、太子道、停車場天台、海港船上、彩虹邨後面嘅棋盤山頂、鯉魚門（31 號跑道）同太平山頂</li>
<li><strong>客運大樓內部：</strong>離境大堂、離境入境檢查、商店街、登機閘口候機室、地下大堂同樓梯、抵港大堂同正門</li>
</ul>
<p>喺一個選單揀咗視角，其他兩個會返回標題，咁就一眼睇到而家用緊邊個。細畫面嘅話，觀機位置同客運大樓內部選單喺「更多」入面。</p>
