<p>協和式客機嘅引擎進氣口以前係突出喺機翼前面，好似兩個桶仔釘喺前面。而家佢哋喺機翼前緣下面，同真機一樣，前面冇嘢突出。</p>

  <div class="readout" role="listitem"><b>深色開口</b><span>由前面睇到<i>中間有分隔板</i></span></div>

<h2>改咗啲乜</h2>
<p>協和式客機每邊有一個引擎艙，入面有兩部引擎。引擎艙前面以前係直切，外邊嗰個角突出喺彎彎哋嘅機翼前緣前面好多。而家前面嘅形狀跟住機翼前緣，剛好停喺前緣後面。由前面望，兩個進氣口係深色嘅，中間有分隔板。</p>
