<p>海港嘅船又再可以駛到啟德半島海堤旁邊，好似九十年代咁沿住 13/31 跑道邊經過。唯一唔會去嘅地方，係通去南停機坪嗰啲滑行道下面嘅水道。</p>

<ul>
<li>帆船同遊艇沿住九龍灣岸邊泊，拖船、嘩啦嘩啦同水警輪喺海堤附近行</li>
<li>跑道對開嗰隻帆船返嚟咗，「海港上嘅船」視角都返嚟</li>
<li>跑道側滑行道同南停機坪之間嘅水道唔會有船泊或者經過</li>
</ul>
