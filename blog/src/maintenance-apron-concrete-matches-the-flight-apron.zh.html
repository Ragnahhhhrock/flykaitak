<p>機庫前面嘅停機坪本來係一塊深色瀝青，同其他停機坪嘅淺色混凝土好唔夾。而家佢改成同一種混凝土顏色，維修停機坪同主停機坪睇落就好似一塊。</p>

<ul>
<li>機庫前面、機庫門口同圍欄維修區周圍嘅維修停機坪，而家用主停機坪嘅混凝土顏色</li>
<li>以前標住深色路面邊界嘅黃線已經拎走</li>
<li>機庫、維修區、射燈同停喺度維修嘅飛機冇變</li>
