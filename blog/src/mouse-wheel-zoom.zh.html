<p>而家可以用滑鼠滾輪縮放。向上滾就放大，向下滾就縮小。</p>

<div class="readouts" role="list">
  <div class="readout" role="listitem"><b>向上滾</b><span>放大<i>1× 至 16×</i></span></div>
  <div class="readout" role="listitem"><b>向下滾</b><span>縮小<i>返回 1×</i></span></div>
  <div class="readout" role="listitem"><b>I / O</b><span>同一組級數<i>鍵盤照用</i></span></div>
</div>

<h2>改咗啲乜</h2>
<p>以前滾輪係轉鏡頭距離。而家用返同 <kbd>I</kbd>、<kbd>O</kbd> 鍵同 Zoom 選單一樣嘅縮放：1×、2×、4×、8× 同 16×。滾輪每一格行一級，所以喺觸控板快速一撥都唔會一下跳到 16×。</p>
