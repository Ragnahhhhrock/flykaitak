<p>觸控操控嘅推力桿而家喺桌面尺寸螢幕上大約長咗一倍，每 1% 推力佔多啲像素，微調容易好多。</p>

<h2>改咗啲乜</h2>
<p>推力桿以前固定 140 px 高，而家會跟視窗大細變長，最長 260 px；細螢幕上會短啲，唔會遮住高度條。手機橫向由 96 px 加到最長 170 px。推力仍然以 1% 為單位移動，自動駕駛接管推力桿嘅方式都冇變。</p>
