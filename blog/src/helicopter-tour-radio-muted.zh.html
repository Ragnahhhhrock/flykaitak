<p>喺<b>香港維港直升機觀光之旅</b>入面，而家你只會聽到導賞員把聲。無線電通話唔會再讀出嚟。</p>

<h2>有咩改變</h2>
<ul>
  <li>觀光期間，進近管制同塔台同降落啟德客機之間嘅通話全部靜音，冇人聲，亦冇靜噪咔聲。</li>
  <li>開咗 Radio 嘅話，通話仍然會以文字喺畫面左邊顯示，你照樣可以睇住九龍灣對面嘅航機動態。</li>
  <li>導賞員講解唔會再被無線電通話拖慢或者打斷。</li>
  <li>旋翼同渦輪聲，同天氣聲效，維持不變。</li>
</ul>
