<p>每篇網誌文章而家都有 <strong>Threads</strong> 分享掣，同 X、Facebook、Reddit、LinkedIn 同 WhatsApp 放埋一齊。</p>

<h2>點運作</h2>
<p>呢個掣會打開一個新嘅 Threads 帖文，已經填好文章標題同連結，由你編輯同發佈。每次㩒掣都會記錄為 <code>share</code> 事件，方法係 <code>threads</code>。</p>
