<p>滑行中嘅飛機而家會保持以前兩倍嘅距離。以前地面管制會畀一架飛機喺滑行道上面行到距離另一架大約 9 米，睇落太近。而家行緊嘅飛機之間最少相距大約 18 米，喺停咗嘅飛機後面就最少大約 10 米。</p>

<h2>有咩改咗</h2>
<ul>
  <li><strong>滑行道上面：</strong>地面管制喺滑行飛機之間保持嘅距離加咗一倍，翼尖同機尾都計埋。</li>
  <li><strong>停咗嘅飛機後面：</strong>距離一樣加倍。</li>
  <li><strong>等起飛：</strong>喺跑道尾排隊起飛嘅飛機仍然可以好似以前咁貼近。</li>
  <li><strong>停機位：</strong>泊機、推出同停機位通道保持原本嘅距離。</li>
</ul>

<h2>冇改到嘅</h2>
<ul>
  <li>降落嘅飛機仍然比起飛嘅飛機優先，跑道管制同以前一樣。</li>
  <li>自動駕駛喺所有天氣設定下仍然降落到，乜都唔做仍然會墜毀。</li>
</ul>
