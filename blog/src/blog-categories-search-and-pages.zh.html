<p>網誌而家有<strong>分類</strong>、<strong>按分類排序</strong>、<strong>每頁 20 篇</strong>同<strong>搜尋框</strong>。</p>

<h2>分類</h2>
<p>每篇文章都屬於一個分類：飛機、飛行同程序、風景同天氣、操控同裝置、分數同分享，或者網站同語言。分類會顯示喺每張文章卡同每篇文章頂部。喺網誌㩒一個分類掣，就只會睇到嗰類文章。</p>

<h2>排序同分頁</h2>
<p>喺文章上面揀<strong>最新</strong>或者<strong>按分類</strong>。每頁顯示 20 篇，下面有上一頁、下一頁同頁碼。</p>

<h2>搜尋</h2>
<p>喺搜尋框輸入文字，就可以按標題、簡介、關鍵字、分類或者文章內文搵文章。結果會一邊打字一邊更新，每頁 20 篇，英文同廣東話都搵得到。</p>
