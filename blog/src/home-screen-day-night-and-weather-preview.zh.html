<p>主畫面後面嘅畫面而家會跟住你嘅選擇即時變。㩒<strong>日間</strong>或<strong>夜間</strong>、揀天氣，或者開關<strong>雲</strong>同<strong>閃電</strong>，後面嘅九龍實時畫面即刻轉。未㩒 Begin descent 之前，就睇到自己會飛入乜嘢天氣。</p>
