<p>觀機模式而家都有 31 號跑道。你可以喺機場嘅觀機位置，或者新增嘅鯉魚門視角，睇東面進場嘅飛機。</p>

<h2>揀「觀機 · 31 號跑道」</h2>
<p>喺設定畫面，喺觀機隔離揀 <strong>觀機 · 31 號跑道</strong>。唔使飛：抵港航班經鯉魚門由東面降落，離港航班向九龍城滑行起飛爬升。你可以跟住一架飛機、轉換觀機位置，或者加快時間。</p>

<h2>鯉魚門視角</h2>
<p>喺視角選單揀 <strong>觀機：鯉魚門（31 號跑道）</strong>，或者按 <kbd>C</kbd> 切換。呢個視角嘅鏡頭會優先跟最近你嗰架飛機，所以抵港航班穿過缺口時，鏡頭會跟住佢哋。</p>
