<p>主畫面而家有個地圖選項，開始飛行之前就可以揀角落地圖要唔要開。</p>

<h2>改咗啲乜</h2>
<p>喺「選項」入面，進場導航同九龍寨城選項之間，多咗一個剔選格，叫「即時飛機地圖」，預設係剔咗。取消剔選，下一次飛行就唔會顯示地圖；剔返就會喺角落地圖睇到你同其他飛機。</p>
<p>飛行途中，Map 掣或者 <kbd>M</kbd> 鍵照舊可以開關。主畫面個剔選格會跟你最後一次嘅選擇，所以返去選單時會顯示而家嘅設定。</p>
