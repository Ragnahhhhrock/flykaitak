<p>Every blog post now has a <strong>Threads</strong> share button, next to X, Facebook, Reddit, LinkedIn and WhatsApp.</p>

<h2>How it works</h2>
<p>The button opens a new Threads post with the article title and link filled in, ready for you to edit and publish. Clicks are counted as a <code>share</code> event with the method <code>threads</code>.</p>
