<p>主畫面左上角而家有<strong>最高分</strong>掣，喺 Blog 同語言切換旁邊。㩒一下打開榜單，再㩒一下就收埋。</p>

<p>面板會顯示頭十次降落，包括官階、呼號、分數、機型同天氣。面板會記住你上次嘅開關狀態，㩒 Esc 就可以收埋。官階點計，請睇<a href="/blog/high-score-table-captains-and-first-officers/">最高分榜文章</a>。</p>
