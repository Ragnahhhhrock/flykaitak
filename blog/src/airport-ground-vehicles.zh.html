<p>停機坪而家唔再空蕩蕩。地勤車輛會服務六架停泊嘅飛機，跑道旁邊亦有消防局同貨倉。</p>

<h2>有咩新嘢</h2>
<ul>
  <li>巴士會駛到前門等候，然後返車廠。</li>
  <li>餐飲車駛到停機位，將車箱升起到機門。</li>
  <li>行李拖車喺機翼下面拖住三架載滿行李嘅車。</li>
  <li>貨櫃車同箱式貨車喺貨倉周圍行駛，另有一部貨車喺服務道路來回。</li>
  <li>消防局有消防車同救援車，其中一部會駛去候命位置再返嚟。</li>
  <li>夜晚車輛會亮起車頭燈、尾燈同閃燈。</li>
</ul>
