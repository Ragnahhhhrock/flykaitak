<p>喺主畫面，「分享」掣比隔離嘅 Facebook 同 Instagram 掣低咗大約 15 像素。而家三個掣已經喺同一行對齊。</p>

<h2>改咗啲乜</h2>
<ul>
  <li>分享、Facebook 同 Instagram 而家頂邊一樣，高度都係 40 像素。</li>
  <li>原因係一條原本畀「操作」面板用嘅間距規則，連分享選單都用咗。呢度已經關咗。</li>
  <li>按分享仍然會打開同一個選單：X、Facebook、Reddit、WhatsApp、Threads、電郵同複製連結。</li>
</ul>
