<p>啟德跑道周圍嘅水面而家清晒。帆船、遊艇、拖船、街渡同水警輪唔再喺九龍灣或者跑道附近泊或者行，因為當年降落航道下面嗰片水係冇船行嘅。</p>

<ul>
<li>九龍灣入面泊住嘅帆船同遊艇冇咗</li>
<li>拖船、嘩啦嘩啦同水警輪唔再喺九龍灣度行</li>
<li>海港其他地方嘅船同跑道（連延長線）保持最少 900 米距離</li>
<li>跑道對開嗰隻帆船冇咗；「海港上嘅船」視角保留，喺同一個位貼住水面</li>
<li>維多利亞港同鯉魚門航道上嘅船照樣喺跑道盡頭以外經過</li>
</ul>
