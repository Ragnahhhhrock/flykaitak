<p>主畫面嗰個綠色嘅大開始掣而家一直都睇得到，唔使再捲到選單最底先搵到。</p>

<h2>一個掣，永遠喺畫面入面</h2>
<p>開始飛行嘅掣以前喺設定清單最尾，有啲玩家冇捲到咁底，就一直見唔到。而家佢會固定喺選單底部，無論咩尺寸嘅螢幕都一樣。掣變大咗、更光、有白色外框，仲會輕輕閃動（如果你部機要求減少動態效果，就唔會閃）。</p>

<p>掣上面嘅字會跟你揀嘅模式轉：進場模式係<strong>開始下降</strong>，直升機觀光係<strong>開始旅程</strong>，Plane Spotter 係<strong>觀看機場</strong>。亦可以㩒 <kbd>Enter</kbd> 用鍵盤開始。</p>
