<p>停機坪上嘅飛機、建築物同地勤車輛而家唔會再互相重疊。</p>

<h2>有咩新嘢</h2>
<ul>
  <li>停車場同消防局原本企喺頭幾個停機位嘅推機路線上。而家搬到停機位東面，避開晒所有機翼。</li>
  <li>行李拖車、貨車同餐飲車會喺視線以外等，直至飛機泊定先出現，唔會再企喺離港飛機推後嘅位置。</li>
  <li>觀機人士嘅停車場天台視角，而家由新位置沿跑道望出去。</li>
</ul>
