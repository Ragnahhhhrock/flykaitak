<p>主畫面一載入，角落地圖就會自動出現，疊喺機場嘅即時畫面上面；喺主畫面都可以用 <kbd>M</kbd> 鍵開關。</p>

<div class="readouts" role="list">
  <div class="readout" role="listitem"><b>載入時</b><span>顯示地圖<i>疊喺即時示範上面</i></span></div>
  <div class="readout" role="listitem"><b>M</b><span>地圖開 / 關<i>主畫面同飛行都得</i></span></div>
  <div class="readout" role="listitem"><b>選項</b><span>剔選格<i>跟住 M 鍵變</i></span></div>

<h2>改咗啲乜</h2>
<p>主畫面背後本來就有模擬器喺度行：一部 747 喺 IGS 進場，機場周圍仲有其他客機。而家地圖會喺左上角畫出同一個飛行同交通，所以未開始飛已經睇到啲飛機喺邊。㩒 <kbd>M</kbd> 收埋，再㩒一次就返嚟。</p>
<p>「選項」入面嘅「即時飛機地圖」剔選格會跟住 M 鍵，手動剔選都一樣。你撳「Begin descent」嗰一刻係點，飛行就點開始。</p>
